name: Garmin Daily Sync

# PRIMARY TRIGGER: AWS EventBridge Scheduler (see README "Automated daily sync").
# It calls the GitHub workflow_dispatch API at ~10:00 AM IST on time, every day.
#
# This cron is only a FALLBACK for when EventBridge is unavailable. GitHub-hosted
# cron is best-effort and has been observed slipping 6+ hours in the 04:00-06:00
# UTC window, so treat anything from here as a safety net, not the primary path.
on:
  schedule:
    - cron: "30 4 * * *" # 10:00 AM IST — fallback only
  workflow_dispatch: # manual "Run workflow" (and EventBridge, if configured)
    inputs:
      history_start:
        description: "Keep daily history back to this date (YYYY-MM-DD). Missing days are backfilled, up to 120 per run."
        required: false
        default: "2026-07-01"

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a history backfill makes several hundred Garmin calls
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import garminconnect; print('garminconnect installed')"

      - name: Restore Garmin token (private)
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          mkdir -p ~/.garminconnect
          chmod 700 ~/.garminconnect
          if [ -z "$GARMINTOKENS" ]; then
            if [ -z "$GARMIN_EMAIL" ] || [ -z "$GARMIN_PASSWORD" ]; then
              echo "::error::Missing GARMINTOKENS secret AND missing GARMIN_EMAIL/GARMIN_PASSWORD fallback. Add either: (1) token JSON as GARMINTOKENS, or (2) email+password as GARMIN_EMAIL/GARMIN_PASSWORD (recommended, self-healing)."
              exit 1
            fi
            echo "No GARMINTOKENS secret — will rely on GARMIN_EMAIL/GARMIN_PASSWORD fresh login."
          else
            # Secret contains the full garmin_tokens.json content (JSON, not a path)
            printf "%s" "$GARMINTOKENS" > ~/.garminconnect/garmin_tokens.json
            chmod 600 ~/.garminconnect/garmin_tokens.json
            echo "Token restored (size: $(wc -c < ~/.garminconnect/garmin_tokens.json) bytes). Not shown for security."
            python -c "import json; d=json.load(open('/home/runner/.garminconnect/garmin_tokens.json')); print('token JSON valid, top-level keys:', list(d.keys())[:5])" || echo "::warning::GARMINTOKENS secret is not valid JSON — sync will try credential fallback"
          fi

      - name: Sync Garmin (keeps full history; refreshes the last week, backfills gaps)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          # Scheduled runs have no inputs -> default history start
          HISTORY_START: ${{ inputs.history_start || '2026-07-01' }}
        run: |
          python sync_garmin.py --since "$HISTORY_START" --months 2 --sink files --out ./garmin
          echo "=== garmin folder ==="
          ls -R garmin || true
          echo "=== data.json head ==="
          head -c 2000 garmin/data.json || true
          # Also recompute power curves for dashboard (real 10s-1h from directPower)
          python fix_power_avg.py || echo "power curves update failed (non-fatal)"
          ls -lh garmin/power_curves.json || true

      - name: AI Analysis via OpenRouter (free models)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install requests
          python ai_analyze.py || echo "::warning::AI analysis failed — check OPENROUTER_API_KEY / quota, but garmin data still committed"
          echo "=== AI output ==="
          ls -lh garmin/ai_insights.* || true
          head -c 3000 garmin/ai_insights.md || true

      - name: Tomorrow briefing (rules-based, no API needed)
        run: |
          python briefing.py || echo "::warning::briefing failed — dashboard will show fallback"
          ls -lh garmin/tomorrow_briefing.* || true

      - name: Commit and push if changed
        run: |
          git config user.name "garmin-bot"
          git config user.email "garmin-bot@users.noreply.github.com"
          git add garmin/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # Use IST for commit message to match dashboard
          TZ=Asia/Kolkata git commit -m "chore: garmin sync $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          # Handle concurrent pushes gracefully
          git pull --rebase || true
          git push || (git pull --rebase && git push)

